# Builds wheels for the major platforms and publishes to PyPI on tag push.
#
# Before pushing the first tag: configure a PyPI Trusted Publisher for this
# repository (workflow file `release.yml`, environment `pypi`) at
# https://pypi.org/manage/account/publishing/ — no token secrets needed.
#
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

  # The full CI suite (cargo fmt/clippy/test on 3 OSes, MSRV, pytest parity)
  # must pass on the tagged commit before anything is published.
  tests:
    needs: [check-version]
    uses: ./.github/workflows/ci.yml

  wheels:
    name: wheel ${{ matrix.platform.target }}
    needs: [check-version]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # smoke: install the wheel and run `cito --version` on the runner
          # (only where the wheel's platform matches the runner's).
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto, smoke: native }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: auto, smoke: "" }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: alpine }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: "" }
          - { runner: macos-14, target: aarch64-apple-darwin, manylinux: "", smoke: native }
          - { runner: macos-14, target: x86_64-apple-darwin, manylinux: "", smoke: "" }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "", smoke: native }
          # Native ARM64 runner (what `maturin generate-ci` uses), so it can be smoke-tested.
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, manylinux: "", smoke: native }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.platform.smoke == 'native'
        with:
          python-version: "3.12"
      - name: Smoke-test the wheel
        if: matrix.platform.smoke == 'native'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then bin="$RUNNER_TEMP/smoke/Scripts"; else bin="$RUNNER_TEMP/smoke/bin"; fi
          "$bin/python" -m pip install --no-index --find-links dist cito
          "$bin/cito" --version
      - name: Smoke-test the wheel (Alpine)
        if: matrix.platform.smoke == 'alpine'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.12-alpine sh -euc \
            'pip install --no-index --find-links /dist cito && cito --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  publish:
    needs: [tests, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME"
